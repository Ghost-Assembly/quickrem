name: Template freshness
on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * 1'
permissions:
  contents: read
concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true
jobs:
  template:
    name: template
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.10.1
      - run: just template-check template-status
