name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.1
      - name: Install native test tools
        run: bash scripts/native_tools.sh
      - run: npm ci --ignore-scripts
      - name: Install browser engines
        run: |
          for attempt in 1 2 3; do
            ./node_modules/.bin/playwright install --with-deps chromium firefox && exit 0
            echo "::warning::Playwright install attempt $attempt failed; retrying"
            sleep 15
          done
          exit 1
      - run: just ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension-bundle
          path: '*.shell-extension.zip'
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: docs
  security:
    name: security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write # Upload CodeQL findings to GitHub code scanning.
      actions: read # Inspect workflow runs and download their tested artifacts.
  sonar:
    name: sonar
    uses: $/.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  ci:
    name: ci
    if: always()
    needs: [checks, security, sonar]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job
        env:
          CHECKS: ${{ needs.checks.result }}
          SECURITY: ${{ needs.security.result }}
          SONAR: ${{ needs.sonar.result }}
        run: test "$CHECKS" = success && test "$SECURITY" = success && test "$SONAR" = success
  docs:
    name: docs
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/pages.yml
    permissions:
      contents: read
      actions: read # Inspect workflow runs and download their tested artifacts.
      pages: write # Publish the tested documentation artifact to Pages.
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
