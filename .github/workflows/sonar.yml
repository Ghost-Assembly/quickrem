name: Sonar
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.1
      - name: Require Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo '::error::SONAR_TOKEN is required; scan cannot be skipped'; exit 1; }
      - run: npm ci --ignore-scripts
      - name: Install native test tools
        run: bash scripts/native_tools.sh
      - run: just coverage
      - name: Analyze the checked pull request or main branch
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REVIEW: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          revision="$(git rev-parse HEAD)"
          project="Ghost-Assembly_$(jq -r .name package.json)"
          if [ -n "$REVIEW" ]; then
            test "$TARGET_BRANCH" = main || { echo '::error::Free-plan PR analysis must target main'; exit 1; }
            sonar-scanner -Dsonar.projectKey="$project" -Dsonar.pullrequest.key="$REVIEW" -Dsonar.pullrequest.branch="$SOURCE_BRANCH" -Dsonar.pullrequest.base="$TARGET_BRANCH" -Dsonar.scm.revision="$revision" -Dsonar.qualitygate.wait=true
            python3 scripts/sonar_gate.py --project "$project" --pull-request "$REVIEW" --revision "$revision"
          else
            test "$BRANCH" = main || { echo '::error::Dispatch main for overall-code analysis on the Free plan'; exit 1; }
            sonar-scanner -Dsonar.projectKey="$project" -Dsonar.branch.name=main -Dsonar.scm.revision="$revision" -Dsonar.qualitygate.wait=true
            python3 scripts/sonar_gate.py --project "$project" --branch main --revision "$revision"
          fi
