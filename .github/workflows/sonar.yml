name: Sonar
on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
  workflow_dispatch:
  schedule:
    - cron: '37 5 * * 1'
permissions:
  contents: read
concurrency:
  group: sonar-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.1
      - name: Require Sonar configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: test -n "$SONAR_TOKEN" || { echo '::error::SONAR_TOKEN is required; scan cannot be skipped'; exit 1; }
      - run: npm ci --ignore-scripts
      - run: just coverage
      - name: Analyze the full checked branch
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          REVIEW: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          branch="$BRANCH"
          if [ -n "$REVIEW" ]; then branch="review-$REVIEW"; fi
          revision="$(git rev-parse HEAD)"
          project="Ghost-Assembly_$(jq -r .name package.json)"
          sonar-scanner -Dsonar.projectKey="$project" -Dsonar.branch.name="$branch" -Dsonar.scm.revision="$revision" -Dsonar.qualitygate.wait=true
          python3 scripts/sonar_gate.py --project "$project" --branch "$branch" --revision "$revision"
