name: Docs
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Inspect workflow runs and download their tested artifacts.
      pages: write # Publish the tested documentation artifact to Pages.
      id-token: write # Authenticate the Pages deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
        with:
          artifact_name: github-pages
