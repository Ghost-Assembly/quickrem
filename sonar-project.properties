# SonarQube Cloud. projectKey and organization must match what Sonar creates
# when the project is imported; adjust them there rather than guessing here.
sonar.projectKey=Ghost-Assembly_quickrem
sonar.organization=ghost-assembly

sonar.sources=modules,extension.js,prefs.js
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**,docs/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# extension.js only pairs construction with teardown; it is covered by
# scripts/headless-check.sh, which enables, disables and re-enables the real
# extension in a real gnome-shell. Kept identical to what vitest.config.js
# measures, so the two agree.
sonar.coverage.exclusions=extension.js
